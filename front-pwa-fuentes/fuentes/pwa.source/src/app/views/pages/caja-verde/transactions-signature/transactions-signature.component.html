<div class="row justify-content-center mt-2">
  <div class="col text-center">

    <h1 class="text-center">Firma Digital</h1>
    <p class="h3 subtitle-p text-dark">
      Aquí podrás ingresar tu firma digital
    </p>
    <div style="width:{{sizeW}}px;display: inline-block;">
      <div class="d-flex flex-row-reverse">
        <button type="button" (click)="clear()" class="btn btn-link"><mat-icon aria-hidden="false" aria-label="Limpiar firma">delete_outline</mat-icon></button>
      </div>
    </div>


    <div class="">
      <div class="">
        <canvas class="canvasPad" #sPad [width]="sizeW" style="touch-action: none;" [height]="sizeh"></canvas>
      </div>
    </div>
    <p class="h3 subtitle-p text-dark">
      Se requiere el ingreso de su firma digital
      como constancia de confirmación de su
      depósito
    </p>

    <p *ngIf="isSignEmpty" class="h3 subtitle-p text-warning">
      Primero proporcione una firma.
    </p>

  </div>
</div>

<div class="container mt-3">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <button
        (click)="setSing()"
        type="button"
        mat-stroked-button
        color="primary"
        class="w-100 p-2 border-button-footer mt-3"
      >
        <span class="h2">Aceptar</span>
      </button>
    </div>
  </div>
</div>
<div class="container mt-3">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <button
        routerLink="/formulario-de-deposito"
        type="button"
        mat-stroked-button
        color="primary"
        class="w-100 p-2 border-button-footer mt-3"
      >
        <span class="h2">Volver</span>
      </button>
    </div>
  </div>
</div>
